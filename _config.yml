title: "UniFicar PDF"
description: Merge PDF | Unir PDF
baseurl: ""
url: "https://unificarpdf.com"
liquid:
  error_mode: strict
author: RUPESH

# Multilingual settings
languages: ["en", "fr", "es", "pt", "th", "id", "de", "it", "tr", "hu"]
default_lang: "es"

# Build settings
markdown: kramdown
theme: null
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-include-cache

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor/
  - .bundle/
  - node_modules/

kramdown:
  auto_ids: true
  toc_levels: [2, 3]

# Custom lang + blog permalinks per language
defaults:
  # ---------- POSTS (_posts/<lang>/) ----------
  - scope:
      path: "_posts/es"
      type: "posts"
    values:
      lang: es
      permalink: /blog/:title/

  - scope:
      path: "_posts/en"
      type: "posts"
    values:
      lang: en
      permalink: /en/blog/:title/

  - scope:
      path: "_posts/fr"
      type: "posts"
    values:
      lang: fr
      permalink: /fr/blog/:title/

  - scope:
      path: "_posts/pt"
      type: "posts"
    values:
      lang: pt
      permalink: /pt/blog/:title/

  - scope:
      path: "_posts/th"
      type: "posts"
    values:
      lang: th
      permalink: /th/blog/:title/

  - scope:
      path: "_posts/id"
      type: "posts"
    values:
      lang: id
      permalink: /id/blog/:title/

  - scope:
      path: "_posts/de"
      type: "posts"
    values:
      lang: de
      permalink: /de/blog/:title/

  - scope:
      path: "_posts/it"
      type: "posts"
    values:
      lang: it
      permalink: /it/blog/:title/

  - scope:
      path: "_posts/tr"
      type: "posts"
    values:
      lang: tr
      permalink: /tr/blog/:title/

  - scope:
      path: "_posts/hu"
      type: "posts"
    values:
      lang: hu
      permalink: /hu/blog/:title/


  # ---------- PAGES (root-level <lang>/ folders) ----------
  - scope:
      path: "es"
      type: "pages"
    values:
      lang: es
      permalink: /:path/

  - scope:
      path: "en"
      type: "pages"
    values:
      lang: en
      permalink: /en/:path/

  - scope:
      path: "fr"
      type: "pages"
    values:
      lang: fr
      permalink: /fr/:path/

  - scope:
      path: "pt"
      type: "pages"
    values:
      lang: pt
      permalink: /pt/:path/

  - scope:
      path: "th"
      type: "pages"
    values:
      lang: th
      permalink: /th/:path/

  - scope:
      path: "id"
      type: "pages"
    values:
      lang: id
      permalink: /id/:path/

  - scope:
      path: "de"
      type: "pages"
    values:
      lang: de
      permalink: /de/:path/

  - scope:
      path: "it"
      type: "pages"
    values:
      lang: it
      permalink: /it/:path/

  - scope:
      path: "tr"
      type: "pages"
    values:
      lang: tr
      permalink: /tr/:path/

  - scope:
      path: "hu"
      type: "pages"
    values:
      lang: hu
      permalink: /hu/:path/

collections:
  en:
    output: true
  fr:
    output: true
  es:
    output: true
  pt:
    output: true
  th:
    output: true
  id:
    output: true
  de:
    output: true
  it:
    output: true
  tr:
    output: true
  hu:
    output: true

include:
  - _headers
  - _redirects
  - 404.html
